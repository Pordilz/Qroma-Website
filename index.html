        <section aria-labelledby="about-qroma">
          <h2 id="about-qroma">What Does Qroma Do?</h2>
          <p>Qroma is a development and creative studio based in Durban, South Africa. We build and run our own
            software products, and take on a small number of client builds each year. We work across product
            engineering, design and systems — usually all three on the same project.</p>

          <h3>The Three Disciplines</h3>
          <ul>
            <li><strong>Product:</strong> web applications, platforms, commerce and native mobile builds.</li>
            <li><strong>Studio:</strong> brand identity, interface and interaction design, motion and content
              strategy.</li>
            <li><strong>Systems:</strong> workflow automation, APIs, data pipelines and infrastructure as code.</li>
          </ul>

          <h3>Products We Have Built</h3>
          <ul>
            <li><strong><a href="https://halaq.vercel.app">Halaq</a>:</strong> Shariah-compliance screening for JSE
              and US equities, built on AAOIFI methodology and cross-checked against two independent data sources.</li>
            <li><strong><a href="https://ifrs-ledger.vercel.app">The Ledger</a>:</strong> an IFRS teaching ledger for
              South African accounting students — journal entries, statement impact, deferred tax, VAT and
              disclosures from a plain-English transaction.</li>
            <li><strong><a href="https://vidmetrics-omega.vercel.app">VidMetrics</a>:</strong> competitive YouTube
              intelligence — trending scores, engagement analytics and publishing cadence for any channel.</li>
            <li><strong>SkyLogger:</strong> a containerised aviation telemetry pipeline storing live flight data to
              PostgreSQL.</li>
            <li><strong>The Vault:</strong> a compliant, tamper-proof cloud document archive defined entirely in
              Terraform.</li>
            <li><strong>ScentCast:</strong> a native Android app that recommends a fragrance from your collection
              based on local weather.</li>
          </ul>

          <h3>Client Work</h3>
          <ul>
            <li><strong><a href="https://www.thefixsir.co.za/">The FixSir</a>:</strong> a booking-first site for a
              mobile sports massage and Hijama therapy practice in Durban, routed entirely through WhatsApp.</li>
          </ul>

          <img src="images/qroma-logo.jpg" alt="Qroma studio logo" width="300" height="300" loading="lazy">

          <p><strong>Ready to build something?</strong> Contact us today.</p>
        </section>

        <hr>

        <section aria-labelledby="faq-section">
          <h2 id="faq-section">Frequently Asked Questions</h2>

          <details>
            <summary><strong>What kind of work does Qroma take on?</strong></summary>
            <p>We build software — web applications, platforms, native mobile apps, data pipelines and the
              infrastructure under them — along with the brand and interface that goes on top.</p>
          </details>

          <details>
            <summary><strong>How do you price a project?</strong></summary>
            <p>We scope the work and quote it. There are three ways to engage: Build for a defined project, Partner
              for an ongoing monthly retainer, and Lab where we co-build a product with shared risk and upside.</p>
          </details>

          <details>
            <summary><strong>Who owns the code you write?</strong></summary>
            <p>On client builds, you do — transferred on final payment, in a repository you control.</p>
          </details>

          <details>
            <summary><strong>Where is Qroma based?</strong></summary>
            <p>We are based in Durban, KwaZulu-Natal, and work with clients across South Africa and
              internationally.</p>
          </details>
        </section>
      </article>
